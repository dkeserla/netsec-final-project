[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minpriv"
version = "0.1.0"
description = "Extensible benchmark harness for evaluating least-privilege adherence in LLM agents"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "litellm>=1.0",
    "typer>=0.12",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["minpriv*"]
